name: Build FanchmWrt for JDCloud RE-SS-01

on:
  workflow_dispatch:
    inputs:
      enable_docker:
        description: '是否编译 Docker (true/false)'
        required: true
        default: 'true'
      ssh_debug:
        description: 'SSH 远程调试 (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: openwrt-main
  DEVICE_NAME: jdcloud_re-ss-01
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 检出当前仓库与初始化空间
        uses: actions/checkout@v4

      - name: 2. 清理磁盘空间并安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 3. 克隆 FanchmWrt 源码并注入第三方插件 Feeds
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt

          # 注入 PassWall、PassWall2 及 OpenClash 官方软件源
          cat << 'EOF' >> feeds.conf.default
          src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main
          src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git;main
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          EOF

          ./scripts/feeds update -a
          # 优先从 passwall_packages 安装最新代理核心组件（sing-box, xray-core 等）
          ./scripts/feeds install -a -f -p passwall_packages
          ./scripts/feeds install -a -f -p passwall
          ./scripts/feeds install -a -f -p passwall2
          ./scripts/feeds install -a -f -p openclash
          ./scripts/feeds install -a

      - name: 4. 生成 .config 配置文件并预下载 Clash 内核
        run: |
          cd openwrt

          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

          # USB 网络共享与驱动
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_usb-modeswitch=y

          # PassWall & PassWall2 & OpenClash
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Haproxy=y
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-openclash=y

          # 底层网络依赖 (nftables / TPROXY / TUN)
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          # eMMC 磁盘工具
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_cfdisk=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_lsblk=y
          EOF

          if [ "${{ github.event.inputs.enable_docker }}" = "true" ]; then
            cat << 'EOF' >> .config
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_KERNEL_OVERLAY_FS=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
          CONFIG_PACKAGE_cgroupfs-mount=y
          EOF
          fi

          # 预置 OpenClash Meta (Mihomo) arm64 内核，免去刷机后首次启动下载失败烦恼
          mkdir -p files/etc/openclash/core
          curl -sL https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-arm64.tar.gz | tar xOvz > files/etc/openclash/core/clash_meta
          chmod +x files/etc/openclash/core/clash_meta

          make defconfig

      - name: 5. 下载 dl 源码包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 6. 多线程编译固件
        run: |
          cd openwrt
          echo "开始使用 $(nproc) 线程编译..."
          make -j$(nproc) || make -j1 V=s

      - name: 7. 上传编译产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-qualcommax-ipq60xx-jdcloud_re-ss-01
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*re-ss-01*
            openwrt/.config
          if-no-files-found: error


四、 方案 B：本地 Ubuntu 22.04 编译一键脚本

如果你有一台联网的 Ubuntu 22.04 主机或 WSL2 环境（需预留约 50GB 磁盘空间，切勿使用 root 用户直接执行 make），可以按顺序运行以下命令：

# 1. 安装编译环境依赖
sudo apt update && sudo apt install -y \
  ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
  bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
  gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
  libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
  libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
  libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
  pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils \
  rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
  vim wget xmlto xxd zlib1g-dev

# 2. 克隆 FanchmWrt 主线分支 (支持 JDCloud RE-SS-01)
git clone --depth 1 -b openwrt-main https://github.com/fanchmwrt/fanchmwrt.git
cd fanchmwrt

# 3. 追加 PassWall / PassWall2 / OpenClash 插件源
cat << 'EOF' >> feeds.conf.default
src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main
src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main
src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git;main
src-git openclash https://github.com/vernesong/OpenClash.git;master
EOF

# 4. 更新并安装 Feeds（优先应用 passwall_packages 中的新版本依赖包）
./scripts/feeds update -a
./scripts/feeds install -a -f -p passwall_packages
./scripts/feeds install -a -f -p passwall
./scripts/feeds install -a -f -p passwall2
./scripts/feeds install -a -f -p openclash
./scripts/feeds install -a

# 5. 将本文第二节中的《种子配置文件》内容写入 .config，然后补全依赖
make defconfig

# （可选）打开菜单界面微调其他插件
# make menuconfig

# 6. 预下载源码包并开始编译
make download -j8 V=s
make -j$(nproc) || make -j1 V=s
